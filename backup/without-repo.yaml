name: 'Manjaro Iso Action'
description: 'Installs prerequisites for building Manjaro on ubuntu'

inputs:
  iso-profiles-repo:
    description: 'iso profiles to clone'
    required: false
    default: 'https://gitlab.manjaro.org/profiles-and-settings/iso-profiles'
  iso-profiles-branch:
    description: 'branch of the iso profiles to check out'
    required: false
  edition:
    description: 'name of the iso profile to build'
    required: true
  branch:
    description: 'stable (default), testing, unstable'
    required: false
    default: stable
  scope:
    description: 'full (default) or minimal image'
    required: false
    default: full
  version:
    description: 'dist_release version (upstream if not given)'
    required: false
  kernel:
    description: 'kernel version'
    required: false
    default: linux510
  code-name:
    description: 'manjaro code-name (upstream if not given)'
    required: false
  release-tag:
    description: 'release tag to upload to (if set)'
    required: false
  custom-repo:
    description: 'name a custom repo to be prioritized above the default ones'
    required: false
  office-chooser:
    description: 'include calamares office installer module'
    required: false
    default: "false"
  build-mirror:
    description: 'specific build mirror to use'
    required: false
    default: https://mirror.easyname.at/manjaro
  archlinux-core-db-urls:
    description: 'space separated fallback URLs to Arch core.db (x86_64) used to resolve the latest archlinux-keyring package'
    required: false
    default: "https://mirrors.edge.kernel.org/archlinux/core/os/x86_64/core.db https://mirrors.ocf.berkeley.edu/archlinux/core/os/x86_64/core.db"
  gpg-secret-key-base64:
    description: 'base64 encoded gpg secret key (without a passphrase) to sign the zip (if set)'
    required: false
  gpg-passphrase:
    description: 'phrase to decrypt the gpg secret key if given'
    required: false
  additional-trusted-gpg:
    description: 'gpg keyids that pacman should trust'
    required: false
  cdn77-host:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-user:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-pwd:
    description: 'cdn77 upload credentials'
    required: false
  sf-project:
    description: 'sf upload credentials'
    required: false
  sf-user:
    description: 'sf upload credentials'
    required: false
  sf-key:
    description: 'sf upload credentials'
    required: false
  osdn-project:
    description: 'osdn upload credentials'
    required: false
  osdn-user:
    description: 'osdn upload credentials'
    required: false
  osdn-key:
    description: 'osdn upload credentials'
    required: false
  s3-cfg:
    description: 'S3 config'
    required: false

outputs:
  file-path:
    description: "path of the generated iso"
    value: ${{ steps.image-build.outputs.file-path }}

runs:
  using: "composite"
  steps:
    - id: install-build-dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install \
          gdisk \
          zip \
          systemd-container \
          bmap-tools \
          asciidoc \
          libarchive-tools \
          git \
          build-essential \
          cmake \
          libarchive-dev \
          pkg-config \
          libcurl4-openssl-dev \
          libgpgme-dev \
          libssl-dev \
          fakeroot \
          dh-autoreconf \
          haveged \
          libgpg-error-dev \
          libassuan-dev \
          libksba-dev \
          libnpth0-dev \
          libldap2-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          zlib1g-dev \
          libncursesw5-dev \
          gettext \
          autopoint \
          docbook-xsl \
          xsltproc \
          lzop \
          cpio \
          python3-pip \
          python3-setuptools \
          python3-wheel \
          python3-dev \
          rsync \
          sshfs \
          libglib2.0-dev \
          p7zip-full \
          imagemagick \
          gnupg \
          squid \
          libparse-yapp-perl \
          pkgconf \
          mktorrent

        sudo pip3 install yq

    - id: install-manjaro-build-tools
      shell: bash
      run: |
        sudo git clone --depth 1 https://gitlab.manjaro.org/tools/development-tools/manjaro-build.git
        cd manjaro-build
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install
        cd ..

    - id: install-manjaro-pkg-tools
      shell: bash
      run: |
        sudo git clone --depth 1 https://gitlab.manjaro.org/tools/development-tools/manjaro-pkg.git
        cd manjaro-pkg
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install
        cd ..

    - id: install-arch-install-scripts
      shell: bash
      env:
        VERSION: "27"
      run: |
        sudo wget https://github.com/archlinux/arch-install-scripts/archive/refs/tags/v${VERSION}.tar.gz -O arch-install-scripts.tar.gz
        sudo tar -xvf arch-install-scripts.tar.gz
        sudo make -C arch-install-scripts-${VERSION}
        sudo make -C arch-install-scripts-${VERSION} check
        sudo make -C arch-install-scripts-${VERSION} PREFIX=/usr install

        sudo wget https://gitlab.manjaro.org/applications/pacman-mirrors/-/tree/master/data/etc/pacman-mirrors.conf -O /etc/pacman-mirrors.conf

    - id: install-calamares-tools
      shell: bash
      run: |
        sudo git clone --depth 1 https://gitlab.manjaro.org/applications/calamares-tools.git

        cd calamares-tools
        sudo install -d /usr/share/calamares/
        sudo cp -rv schemas/ /usr/share/calamares/

    - id: install-mkinitcpio
      shell: bash
      env:
        VERSION: "32"
      run: |
        sudo wget https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v${VERSION}/mkinitcpio-v${VERSION}.tar.gz
        sudo tar -xf mkinitcpio-v${VERSION}.tar.gz
        sudo make -C mkinitcpio-v${VERSION} install
        sudo sed -i -e 's|File|Path|' /usr/share/libalpm/hooks/*hook

    - id: install-manjaro-tools
      shell: bash
      env:
        CUSTOM_REPO: ${{ inputs.custom-repo }}
      run: |
        sudo git clone --depth 1 \
          --branch awesome-manjaro \
          https://github.com/megvadulthangya/manjaro-tools.git
        cd manjaro-tools
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_base
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_yaml
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_iso
        if [ ! -z ${CUSTOM_REPO} ]; then
          echo "## adding repo [${CUSTOM_REPO}]"
          sudo sed -i -e "s/\[core\]/\[${CUSTOM_REPO}\]\nSigLevel = PackageRequired\nInclude = \/etc\/pacman\.d\/mirrorlist\n\n\[core\]/" /usr/share/manjaro-tools/pacman-multilib.conf
        fi

    - id: checkout-iso-profiles
      shell: bash
      env:
        REPO: ${{ inputs.iso-profiles-repo }}
        BRANCH: ${{ inputs.iso-profiles-branch }}
      run: sudo git clone ${BRANCH:+--branch ${BRANCH}} --depth 1 ${REPO} iso-profiles

    - id: cleanup_space_workaround
      shell: bash
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /opt/hostedtoolcache/Ruby || true
        sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
        sudo rm -rf /opt/hostedtoolcache/go || true
        sudo apt-get clean || true
        df -h

    - id: install-keyrings
      shell: bash
      run: |
        # install keyrings - needed for manjaro-chroot
        sudo bash -c "$(wget 'https://raw.githubusercontent.com/endeavouros-team/PKGBUILDS/master/endeavouros-mirrorlist/endeavouros-mirrorlist.install' -qO -)" || echo "endeavouros-mirrorlist: already installed"

        sudo mkdir -p /etc/pacman.d/gnupg
        pushd /etc/pacman.d/gnupg
          sudo pacman-key --init
          sudo pacman-key --populate archlinux
          sudo pacman-key --populate manjaro
        popd

        sudo pacman-key --populate archlinux manjaro

        # Update keyrings to include latest key additions
        sudo pacman -Sy --noconfirm manjaro-keyring archlinux-keyring

        # temp workaround for archlinux-keyring installation on ubuntu
        # Arch infra sometimes fails with GnuTLS / Pull function errors, so we resolve the latest package via core.db
        pushd /tmp
        sudo mkdir -p archlinux-keyring
        pushd archlinux-keyring
          ARCH_CORE_DB_URLS="${{ inputs.archlinux-core-db-urls }}"
          UA="Mozilla/5.0"

          tmpdb="$(mktemp)"
          tmpdesc="$(mktemp)"
          pkgfile=""

          for dburl in ${ARCH_CORE_DB_URLS}; do
            echo "## archlinux-keyring: trying core.db ${dburl}"
            if wget --user-agent="${UA}" -qO "${tmpdb}" "${dburl}"; then
              entry="$(bsdtar -tf "${tmpdb}" 2>/dev/null | grep -E '^archlinux-keyring-[^/]+/desc$' | head -n 1 || true)"
              if [ -n "${entry}" ]; then
                bsdtar -xOf "${tmpdb}" "${entry}" > "${tmpdesc}" 2>/dev/null || true
                pkgfile="$(awk '$0=="%FILENAME%"{getline; print; exit}' "${tmpdesc}" || true)"
                if [ -n "${pkgfile}" ]; then
                  echo "## archlinux-keyring: latest package ${pkgfile}"
                  break
                fi
              fi
            fi
          done

          if [ -z "${pkgfile}" ]; then
            echo "ERROR: Could not resolve latest archlinux-keyring from core.db"
            exit 1
          fi

          dl_ok=0
          for dburl in ${ARCH_CORE_DB_URLS}; do
            base="${dburl%/*}"
            pkgurl="${base}/${pkgfile}"
            echo "## archlinux-keyring: trying package ${pkgurl}"
            if wget --user-agent="${UA}" -qO /tmp/archlinux-keyring.tar.zst "${pkgurl}"; then
              dl_ok=1
              break
            fi
          done

          rm -f "${tmpdb}" "${tmpdesc}"

          if [ "${dl_ok}" -ne 1 ]; then
            echo "ERROR: Could not download ${pkgfile} from configured mirrors"
            exit 1
          fi

          tar --use-compress-program=unzstd --strip-components=4 --wildcards -xvf /tmp/archlinux-keyring.tar.zst usr/share/pacman/keyrings/*
          sudo install -m0644 archlinux.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-trusted /usr/share/pacman/keyrings/
        popd
        popd

    - id: install-manjaro-tools-dependencies
      shell: bash
      run: |
        sudo pacman -S --noconfirm --needed \
          archlinux-mirrorlist \
          pacman-mirrors \
          pacman-contrib \
          manjaro-release \
          manjaro-keyring \
          manjaro-settings-manager \
          manjaro-system \
          pacman \
          inxi

    - id: setup-manjaro-build-mirror
      shell: bash
      env:
        BUILD_MIRROR: ${{ inputs.build-mirror }}
      run: |
        # configure pacman mirrors for the build
        sudo pacman-mirrors -c all -B stable

        if [ ! -z ${BUILD_MIRROR} ]; then
          echo "## Using custom build mirror: ${BUILD_MIRROR}"
          sudo pacman-mirrors -g -m ${BUILD_MIRROR}
        else
          sudo pacman-mirrors -g
        fi

        sudo pacman -Syy

    - id: setup-additional-trusted-gpg
      shell: bash
      env:
        TRUSTED_GPG: ${{ inputs.additional-trusted-gpg }}
      run: |
        if [ -z "${TRUSTED_GPG}" ]; then
          echo "## no additional trusted gpg keys"
          exit 0
        fi
        echo "## trusting ${TRUSTED_GPG}"
        for key in ${TRUSTED_GPG}; do
          sudo pacman-key --recv-keys ${key}
          sudo pacman-key --lsign-key ${key}
        done

    - id: patch-calamares-office-chooser
      shell: bash
      env:
        ENABLED: ${{ inputs.office-chooser }}
      run: |
        if [ "${ENABLED}" != "true" ]; then
          echo "## office chooser disabled"
          exit 0
        fi
        # calamares-office-chooser depends on python-yaml
        sudo pacman -S --noconfirm --needed python-yaml

        # patch calamares modules.conf
        FILE=./iso-profiles/shared/calamares/modules.conf
        if [ -f "${FILE}" ]; then
          echo "## enabling office chooser"
          yq e '.sequence |= map( if . == "users" then "users\n- officechooser" else . end )' -i "${FILE}"
        else
          echo "## modules.conf not found"
        fi

    - id: patch-iso-profiles
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        BRANCH: ${{ inputs.branch }}
        SCOPE: ${{ inputs.scope }}
        VERSION: ${{ inputs.version }}
        KERNEL: ${{ inputs.kernel }}
        CODE_NAME: ${{ inputs.code-name }}
      run: |
        # patch iso-profiles profile.conf
        FILE=./iso-profiles/${EDITION}/profile.conf
        if [ -f "${FILE}" ]; then
          echo "## patching profile.conf"
          if [ ! -z ${BRANCH} ]; then
            sudo sed -i -e "s/^branch=.*/branch=${BRANCH}/" ${FILE}
          fi
          if [ ! -z ${SCOPE} ]; then
            sudo sed -i -e "s/^scope=.*/scope=${SCOPE}/" ${FILE}
          fi
          if [ ! -z ${VERSION} ]; then
            sudo sed -i -e "s/^version=.*/version=${VERSION}/" ${FILE}
          fi
          if [ ! -z ${KERNEL} ]; then
            sudo sed -i -e "s/^kernel=.*/kernel=${KERNEL}/" ${FILE}
          fi
          if [ ! -z ${CODE_NAME} ]; then
            sudo sed -i -e "s/^code_name=.*/code_name=${CODE_NAME}/" ${FILE}
          fi
        else
          echo "## ${FILE} not found"
          exit 1
        fi

    - id: image-build
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
      run: |
        echo "## building iso"
        sudo buildiso -p ${EDITION}

        # find iso
        ISO=$(ls -1t /var/cache/manjaro-tools/iso/*${EDITION}*.iso | head -n 1)
        if [ -z "${ISO}" ]; then
          echo "## ISO not found"
          exit 1
        fi

        echo "file-path=${ISO}" >> $GITHUB_OUTPUT

    - id: upload-prepare
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        VERSION: ${{ inputs.version }}
        ISO: ${{ steps.image-build.outputs.file-path }}
      run: |
        # determine version if not given
        if [ -z "${VERSION}" ]; then
          VERSION=$(ls -1t /var/cache/manjaro-tools/iso/*${EDITION}*.iso | head -n 1 | sed -e 's/.*-\([0-9\.]\+\)-.*/\1/')
        fi

        ISO_FILE=$(basename ${ISO})
        ISO_DIR=$(dirname ${ISO})
        FILES="${ISO}"

        # checksums
        pushd ${ISO_DIR}
          sha256sum ${ISO_FILE} > ${ISO_FILE}.sha256
          b2sum ${ISO_FILE} > ${ISO_FILE}.b2
          FILES="${FILES} ${ISO_DIR}/${ISO_FILE}.sha256 ${ISO_DIR}/${ISO_FILE}.b2"
        popd

        # create torrent
        mktorrent -v -a udp://tracker.opentrackr.org:1337 -l 21 \
          -w "https://download.manjaro.org/${EDITION}/${VERSION}/${ISO_FILE}" \
          -o ${ISO}.torrent ${ISO}
        FILES="${FILES} ${ISO}.torrent"

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "iso-file=${ISO_FILE}" >> $GITHUB_OUTPUT
        echo "upload-files=${FILES}" >> $GITHUB_OUTPUT

    - id: sign-zip
      shell: bash
      env:
        SECRET_KEY_B64: ${{ inputs.gpg-secret-key-base64 }}
        PASSPHRASE: ${{ inputs.gpg-passphrase }}
        ISO: ${{ steps.image-build.outputs.file-path }}
      run: |
        if [ -z "${SECRET_KEY_B64}" ]; then
          echo "## no gpg key given - not signing"
          exit 0
        fi

        echo "## importing gpg key"
        echo "${SECRET_KEY_B64}" | base64 -d > /tmp/secret.key
        gpg --batch --import /tmp/secret.key

        echo "## signing zip"
        zip -j ${ISO}.zip ${ISO}
        gpg --batch --yes --pinentry-mode loopback --passphrase "${PASSPHRASE}" \
          --output ${ISO}.zip.sig --detach-sign ${ISO}.zip

    - id: upload-osdn
      shell: bash -O extglob {0}
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.osdn-project }}" ]; then 
          echo "## no OSDN project given"
          exit 0
        fi

        echo "## OSDN upload"
        mkdir -p ~/.ssh
        echo "${{ inputs.osdn-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa storage.osdn.net >> ~/.ssh/known_hosts

        ## create target dir
        rsync -vaP --stats -e ssh ${{ inputs.edition }} \
          ${{ inputs.osdn-user }}@storage.osdn.net:/storage/groups/m/ma/${{ inputs.osdn-project }}/

        ## upload
        rsync -vaP --stats -e ssh ${{ steps.upload-prepare.outputs.upload-files }} \
          ${{ inputs.osdn-user }}@storage.osdn.net:/storage/groups/m/ma/${{ inputs.osdn-project }}/${{ inputs.edition }}/${{ inputs.version }}/

    - id: upload-sourceforge
      shell: bash -O extglob {0}
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.sf-project }}" ]; then 
          echo "## no Sourceforge project given"
          exit 0
        fi

        echo "## sourceforge upload"
        mkdir -p ~/.ssh
        echo "${{ inputs.sf-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa frs.sourceforge.net >> ~/.ssh/known_hosts

        ## create target dir
        rsync -vaP --stats -e ssh ${{ inputs.edition }} \
          ${{ inputs.sf-user }}@frs.sourceforge.net:/home/frs/project/${{ inputs.sf-project }}/

        ## upload
        rsync -vaP --stats -e ssh ${{ steps.upload-prepare.outputs.upload-files }} \
          ${{ inputs.sf-user }}@frs.sourceforge.net:/home/frs/project/${{ inputs.sf-project }}/${{ inputs.edition }}/${{ inputs.version }}/

    - id: upload-github-release
      shell: bash -O extglob {0}
      env:
        LIMIT_MB: '2000'
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.release-tag }}" ]; then 
          echo "## no release tag given"
          exit 0
        fi
        echo "## github upload"

        echo ${{ github.token }} | gh auth login --with-token
        gh release create ${{ inputs.release-tag }} --title ${{ inputs.release-tag }} --repo ${{ github.repository }} --notes "automated release" || echo "release already exists"

        GITHUB_LINK=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release-tag }}

        if [[ -z "$(du --threshold=${LIMIT_MB}M ${{ steps.image-build.outputs.file-path }})" ]]; then
          # iso is small enough to upload already
          gh release upload ${{ inputs.release-tag }} --repo ${{ github.repository }} --clobber \
            ${{ steps.upload-prepare.outputs.upload-files }}
        else
          # iso is too big - creating a split-zip
          zip -j -s ${LIMIT_MB}m ${{ steps.image-build.outputs.file-path }}.zip ${{ steps.image-build.outputs.file-path }}

          REMOTE_FILES=$(find . -maxdepth 1 -name "*.z*" -exec basename {} \; | xargs -I{} echo "-w \"${GITHUB_LINK}/{}\"")
          gh release upload ${{ inputs.release-tag }} --repo ${{ github.repository }} --clobber \
            ./${{ steps.image-build.outputs.file-path }}+(.z*|.sha*|.pkgs|.sig|.torrent)
        fi

    - name: upload-cdn77-s3
      shell: bash -O extglob {0}
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.s3-cfg }}" ]; then
          echo "## credentials for cdn77 S3 upload not provided. Skipping."
          exit 0
        fi

        echo "## create torrent"
        mktorrent -v -a udp://tracker.opentrackr.org:1337 -l 21 \
          -w "https://download.manjaro.org/${{ inputs.edition }}/${{ inputs.version }}/${{ steps.image-build.outputs.file-path }}" \
          -o ${{ steps.image-build.outputs.file-path }}.torrent ${{ steps.image-build.outputs.file-path }}

        echo "## cdn77 S3 upload"
        # copy config
        echo "${{ inputs.s3-cfg }}" > /home/runner/.s3cfg
        # create bash array and mv files to dir
        upload_files=( "${{ steps.upload-prepare.outputs.upload-files }}" )
        for f in ${upload_files[@]}; do
          mv ${f} "${{ inputs.edition }}/${{ inputs.version }}/"
        done
        # upload
        s3cmd sync --progress --recursive -F "${{ inputs.edition }}" s3://s3downloadseu/
