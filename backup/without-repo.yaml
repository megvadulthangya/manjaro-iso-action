name: 'Manjaro Iso Action'
description: 'Installs prerequisites for building Manjaro on ubuntu'

inputs:
  iso-profiles-repo:
    description: 'iso profiles to clone'
    required: false
    default: 'https://gitlab.manjaro.org/profiles-and-settings/iso-profiles'
  iso-profiles-branch:
    description: 'branch of the iso profiles to check out'
    required: false
  edition:
    description: 'name of the iso profile to build'
    required: true
  branch:
    description: 'stable (default), testing, unstable'
    required: false
    default: stable
  scope:
    description: 'full (default) or minimal image'
    required: false
    default: full
  version:
    description: 'dist_release version (upstream if not given)'
    required: false
  kernel:
    description: 'kernel version'
    required: false
    default: linux510
  code-name:
    description: 'manjaro code-name (upstream if not given)'
    required: false
  release-tag:
    description: 'release tag to upload to (if set)'
    required: false
  custom-repo:
    description: 'name a custom repo to be prioritized above the default ones'
    required: false
  office-chooser:
    description: 'include calamares office installer module'
    required: false
    default: "false"
  build-mirror:
    description: 'specific build mirror to use'
    required: false
    default: https://mirror.easyname.at/manjaro
  archlinux-core-db-urls:
    description: 'space separated fallback URLs to Arch core.db (x86_64) used to resolve the latest archlinux-keyring package'
    required: false
    default: "https://mirrors.edge.kernel.org/archlinux/core/os/x86_64/core.db https://mirrors.ocf.berkeley.edu/archlinux/core/os/x86_64/core.db"
  gpg-secret-key-base64:
    description: 'base64 encoded gpg secret key (without a passphrase) to sign the zip (if set)'
    required: false
  gpg-passphrase:
    description: 'phrase to decrypt the gpg secret key if given'
    required: false
  additional-trusted-gpg:
    description: 'gpg keyids that pacman should trust'
    required: false
  cdn77-host:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-user:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-pwd:
    description: 'cdn77 upload credentials'
    required: false
  sf-project:
    description: 'sf upload credentials'
    required: false
  sf-user:
    description: 'sf upload credentials'
    required: false
  sf-key:
    description: 'sf upload credentials'
    required: false
  osdn-project:
    description: 'osdn upload credentials'
    required: false
  osdn-user:
    description: 'osdn upload credentials'
    required: false
  osdn-key:
    description: 'osdn upload credentials'
    required: false
  s3-cfg:
    description: 'S3 config'
    required: false

outputs:
  file-path:
    description: "path of the generated iso"
    value: ${{ steps.image-build.outputs.file-path }}

runs:
  using: "composite"
  steps:
    - id: install-build-dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install \
          gdisk \
          zip \
          systemd-container \
          bmap-tools \
          asciidoc \
          libarchive-tools \
          git \
          build-essential \
          cmake \
          libarchive-dev \
          pkg-config \
          libcurl4-openssl-dev \
          libgpgme-dev \
          libssl-dev \
          fakeroot \
          dh-autoreconf \
          haveged \
          libsqlite3-dev \
          libarchive-dev \
          zlib1g-dev \
          libncursesw5-dev \
          gettext \
          autopoint \
          docbook-xsl \
          xsltproc \
          lzop \
          cpio \
          python3-pip \
          python3-setuptools \
          python3-wheel \
          python3-dev \
          rsync \
          libglib2.0-dev \
          p7zip-full \
          imagemagick \
          gnupg \
          squid \
          libparse-yapp-perl \
          pkgconf \
          mktorrent

        sudo pip3 install yq

    - id: install-arch-install-scripts
      shell: bash
      env:
        VERSION: "27"
      run: |
        sudo wget https://github.com/archlinux/arch-install-scripts/archive/refs/tags/v${VERSION}.tar.gz -O arch-install-scripts.tar.gz
        sudo tar -xvf arch-install-scripts.tar.gz
        sudo make -C arch-install-scripts-${VERSION}
        sudo make -C arch-install-scripts-${VERSION} check
        sudo make -C arch-install-scripts-${VERSION} PREFIX=/usr install

        sudo wget https://gitlab.manjaro.org/applications/pacman-mirrors/-/tree/master/data/etc/pacman-mirrors.conf -O /etc/pacman-mirrors.conf

    - id: install-calamares-tools
      shell: bash
      run: |
        sudo git clone --depth 1 https://gitlab.manjaro.org/applications/calamares-tools.git

        cd calamares-tools
        sudo install -d /usr/share/calamares/
        sudo cp -rv schemas/ /usr/share/calamares/

    - id: install-mkinitcpio
      shell: bash
      env:
        VERSION: "32"
      run: |
        sudo wget https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v${VERSION}/mkinitcpio-v${VERSION}.tar.gz
        sudo tar -xf mkinitcpio-v${VERSION}.tar.gz
        sudo make -C mkinitcpio-v${VERSION} install
        sudo sed -i -e 's|File|Path|' /usr/share/libalpm/hooks/*hook

    - id: install-manjaro-tools
      shell: bash
      env:
        CUSTOM_REPO: ${{ inputs.custom-repo }}
      run: |
        sudo git clone --depth 1 \
          --branch awesome-manjaro \
          https://github.com/megvadulthangya/manjaro-tools.git
        cd manjaro-tools
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_base
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_yaml
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_iso
        if [ ! -z ${CUSTOM_REPO} ]; then
          echo "## adding repo [${CUSTOM_REPO}]"
          sudo sed -i -e "s/\[core\]/\[${CUSTOM_REPO}\]\nSigLevel = PackageRequired\nInclude = \/etc\/pacman\.d\/mirrorlist\n\n\[core\]/" /usr/share/manjaro-tools/pacman-multilib.conf
        fi

    - id: checkout-iso-profiles
      shell: bash
      env:
        REPO: ${{ inputs.iso-profiles-repo }}
        BRANCH: ${{ inputs.iso-profiles-branch }}
      run: sudo git clone ${BRANCH:+--branch ${BRANCH}} --depth 1 ${REPO} iso-profiles

    - id: cleanup_space_workaround
      shell: bash
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /opt/hostedtoolcache/Ruby || true
        sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
        sudo rm -rf /opt/hostedtoolcache/go || true
        sudo apt-get clean || true
        df -h

    - id: install-keyrings
      shell: bash
      run: |
        # install keyrings - needed for manjaro-chroot
        sudo bash -c "$(wget 'https://raw.githubusercontent.com/endeavouros-team/PKGBUILDS/master/endeavouros-mirrorlist/endeavouros-mirrorlist.install' -qO -)" || echo "endeavouros-mirrorlist: already installed"

        sudo mkdir -p /etc/pacman.d/gnupg
        pushd /etc/pacman.d/gnupg
          sudo pacman-key --init
          sudo pacman-key --populate archlinux
          sudo pacman-key --populate manjaro
        popd

        sudo pacman-key --populate archlinux manjaro

        # Update keyrings to include latest key additions
        sudo pacman -Sy --noconfirm manjaro-keyring archlinux-keyring

        # temp workaround for archlinux-keyring installation on ubuntu
        # Arch infra sometimes fails with GnuTLS / Pull function errors, so we resolve the latest package via core.db
        mkdir -p /tmp/archlinux-keyring
        pushd /tmp/archlinux-keyring
          mkdir -p db tmp
          pushd db
            # try each URL until one works
            set +e
            dl_ok=0
            for url in ${{ inputs.archlinux-core-db-urls }}; do
              echo "## downloading core.db from ${url}"
              curl -fL "${url}" -o core.db && dl_ok=1 && break
            done
            set -e
            if [ "${dl_ok}" -ne 1 ]; then
              echo "ERROR: Could not download core.db from any provided URL"
              exit 1
            fi

            # Extract archlinux-keyring package filename from core.db
            # core.db is a tar.gz containing desc files
            tar -xf core.db
            # find matching desc for archlinux-keyring
            pkgfile=$(grep -R "^FILENAME" -n archlinux-keyring-*/* 2>/dev/null | head -n1 | sed -E 's/.*= *//')
            if [ -z "${pkgfile}" ]; then
              # fallback: parse desc manually
              tmpdesc=$(find . -maxdepth 2 -name desc -path "*archlinux-keyring*/*" | head -n1)
              pkgfile=$(awk '/%FILENAME%/{getline; print}' "${tmpdesc}")
            fi
            if [ -z "${pkgfile}" ]; then
              echo "ERROR: Could not determine archlinux-keyring package filename from core.db"
              exit 1
            fi
            echo "## resolved archlinux-keyring pkg: ${pkgfile}"
          popd

          # Download the package from a mirror (try the same URLs but path-adjusted)
          set +e
          dl_ok=0
          for base in ${{ inputs.archlinux-core-db-urls }}; do
            # base points to .../core.db ; convert to package base dir .../
            pkgbase=$(echo "${base}" | sed 's|/core\.db$|/|')
            echo "## trying to download ${pkgfile} from ${pkgbase}"
            curl -fL "${pkgbase}${pkgfile}" -o /tmp/archlinux-keyring.tar.zst && dl_ok=1 && break
          done
          set -e
          rm -rf db

          if [ "${dl_ok}" -ne 1 ]; then
            echo "ERROR: Could not download ${pkgfile} from configured mirrors"
            exit 1
          fi

          tar --use-compress-program=unzstd --strip-components=4 --wildcards -xvf /tmp/archlinux-keyring.tar.zst usr/share/pacman/keyrings/*
          sudo install -m0644 archlinux.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-trusted /usr/share/pacman/keyrings/
        popd
        popd

    - id: install-manjaro-tools-dependencies
      shell: bash
      run: |
        sudo pacman -S --noconfirm --needed \
          archlinux-mirrorlist \
          pacman-mirrors \
          pacman-contrib \
          manjaro-release \
          manjaro-keyring \
          manjaro-settings-manager \
          manjaro-system \
          pacman \
          inxi

    - id: setup-manjaro-build-mirror
      shell: bash
      env:
        BUILD_MIRROR: ${{ inputs.build-mirror }}
      run: |
        # configure pacman mirrors for the build
        sudo pacman-mirrors -c all -B stable

        if [ ! -z ${BUILD_MIRROR} ]; then
          echo "## Using custom build mirror: ${BUILD_MIRROR}"
          sudo pacman-mirrors -g -m ${BUILD_MIRROR}
        else
          sudo pacman-mirrors -g
        fi

        sudo pacman -Syy

    - id: setup-additional-trusted-gpg
      shell: bash
      env:
        TRUSTED_GPG: ${{ inputs.additional-trusted-gpg }}
      run: |
        if [ -z "${TRUSTED_GPG}" ]; then
          echo "## no additional trusted gpg keys"
          exit 0
        fi
        echo "## trusting ${TRUSTED_GPG}"
        for key in ${TRUSTED_GPG}; do
          sudo pacman-key --recv-keys ${key}
          sudo pacman-key --lsign-key ${key}
        done

    - id: patch-calamares-office-chooser
      shell: bash
      env:
        ENABLED: ${{ inputs.office-chooser }}
      run: |
        if [ "${ENABLED}" != "true" ]; then
          echo "## office chooser disabled"
          exit 0
        fi
        # calamares-office-chooser depends on python-yaml
        sudo pacman -S --noconfirm --needed python-yaml

        # patch calamares modules.conf
        FILE=./iso-profiles/shared/calamares/modules.conf
        if [ -f "${FILE}" ]; then
          echo "## enabling office chooser"
          yq e '.sequence |= map( if . == "users" then "users\n- officechooser" else . end )' -i "${FILE}"
        else
          echo "## modules.conf not found"
        fi

    - id: patch-iso-profiles
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CODENAME: ${{ inputs.code-name }}
        KERNEL: ${{ inputs.kernel }}
      run: |
        if [ -z "${VERSION}" ] && [ -z "${CODENAME}" ] && [ -z "${KERNEL}" ]; then
          echo "## no iso profiles patching needed"
          exit 0
        fi
        echo "## patching iso-profiles"
        if [ -z "${VERSION}" ]; then
          VERSION=upstream
        fi
        if [ -z "${CODENAME}" ]; then
          CODENAME=upstream
        fi
        if [ -z "${KERNEL}" ]; then
          KERNEL=linux510
        fi
        echo "## version: ${VERSION}, codename: ${CODENAME}, kernel: ${KERNEL}"
        # patch profile defaults
        FILE="./iso-profiles/manjaro-${{ inputs.edition }}/profile.conf"
        if [ -f "${FILE}" ]; then
          sudo sed -i -E "s/^display_version=.*/display_version=${VERSION}/" "${FILE}" || true
          sudo sed -i -E "s/^codename=.*/codename=${CODENAME}/" "${FILE}" || true
          sudo sed -i -E "s/^kernel=.*/kernel=('${KERNEL}')/" "${FILE}" || true
        else
          echo "## profile.conf not found: ${FILE}"
        fi

    - id: image-build
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        BRANCH: ${{ inputs.branch }}
        SCOPE: ${{ inputs.scope }}
      run: |
        echo "## Building iso: edition=${EDITION}, branch=${BRANCH}, scope=${SCOPE}"
        sudo buildiso -p "manjaro-${EDITION}" -b "${BRANCH}" -s "${SCOPE}"

        # try to find output iso
        iso=$(ls -1t *.iso 2>/dev/null | head -n1 || true)
        if [ -z "${iso}" ]; then
          iso=$(find . -maxdepth 2 -type f -name "*.iso" | head -n1 || true)
        fi
        if [ -z "${iso}" ]; then
          echo "ERROR: Could not find generated .iso"
          exit 1
        fi
        echo "## Generated ISO: ${iso}"
        echo "file-path=${iso}" >> "$GITHUB_OUTPUT"
