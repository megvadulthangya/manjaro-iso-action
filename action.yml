name: 'Manjaro Iso Action'
description: 'Installs prerequisites for building Manjaro on ubuntu'

inputs:
  iso-profiles-repo:
    description: 'iso profiles to clone'
    required: false
    default: 'https://code.manjaro.org/profiles/iso-profiles'
  iso-profiles-branch:
    description: 'branch of the iso profiles to check out'
    required: false
  edition:
    description: 'name of the iso profile to build'
    required: true
  branch:
    description: 'stable (default), testing, unstable'
    required: false
    default: stable
  scope:
    description: 'full (default) or minimal image'
    required: false
    default: full
  version:
    description: 'dist_release version (upstream if not given)'
    required: false
  kernel:
    description: 'kernel version'
    required: false
    default: linux618
  code-name:
    description: 'manjaro code-name (upstream if not given)'
    required: false
  release-tag:
    description: 'release tag to upload to (if set)'
    required: false
  custom-repo:
    description: 'name a custom repo to be prioritized above the default ones'
    required: false
  office-chooser:
    description: 'include calamares office installer module'
    required: false
    default: "false"
  build-mirror:
    description: 'specific build mirror to use'
    required: false
    default: https://mirrors.manjaro.org/repo
  pkgbuilds-branch:
    description: 'PKGBUILDs branch to use; latest commit is selected by default'
    required: false
    default: 'main'
  pkgbuilds-commit:
    description: 'Optional full commit SHA from pkgbuilds-branch to pin the source revision'
    required: false
    default: ''
  pacman-mirrors-branch:
    description: 'pacman-mirrors branch to use; latest commit is selected by default'
    required: false
    default: 'master'
  pacman-mirrors-commit:
    description: 'Optional full commit SHA from pacman-mirrors-branch to pin the source revision'
    required: false
    default: ''
  gpg-secret-key-base64:
    description: 'base64 encoded gpg secret key (without a passphrase) to sign the zip (if set)'
    required: false
  gpg-passphrase:
    description: 'phrase to decrypt the secret GPG key if given'
    required: false
  additional-trusted-gpg:
    description: 'gpg keyids that pacman should trust'
    required: false
  cdn77-host:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-user:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-pwd:
    description: 'cdn77 upload credentials'
    required: false
  sf-project:
    description: 'sf upload credentials'
    required: false
  sf-user:
    description: 'sf upload credentials'
    required: false
  sf-key:
    description: 'sf upload credentials'
    required: false
  osdn-project:
    description: 'osdn upload credentials'
    required: false
  osdn-user:
    description: 'osdn upload credentials'
    required: false
  osdn-key:
    description: 'osdn upload credentials'
    required: false
  s3-cfg:
    description: 'S3 config'
    required: false

outputs:
  file-path:
    description: "path of the generated iso"
    value: ${{ steps.image-build.outputs.file-path }}

runs:
  using: "composite"
  steps:
    - id: install-build-dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install \
          gdisk \
          zip \
          systemd-container \
          bmap-tools \
          asciidoc \
          libarchive-tools \
          git \
          build-essential \
          cmake \
          libarchive-dev \
          pkg-config \
          libcurl4-openssl-dev \
          libgpgme-dev \
          libssl-dev \
          fakeroot \
          dh-autoreconf \
          haveged \
          os-prober \
          kwalify \
          dosfstools \
          libisoburn1 \
          squashfs-tools \
          docbook2x \
          mktorrent \
          doxygen \
          zstd \
          s3cmd \
          xorriso
        sudo python3 -m pip install meson
        sudo python3 -m pip install ninja

    - id: checkout-packaging-sources
      shell: bash
      env:
        PKGBUILDS_BRANCH: ${{ inputs.pkgbuilds-branch }}
        PKGBUILDS_COMMIT: ${{ inputs.pkgbuilds-commit }}
        PACMAN_MIRRORS_BRANCH: ${{ inputs.pacman-mirrors-branch }}
        PACMAN_MIRRORS_COMMIT: ${{ inputs.pacman-mirrors-commit }}
      run: |
        set -euo pipefail

        # Keep action-owned checkouts outside GITHUB_WORKSPACE so this action
        # never deletes or overwrites directories belonging to the caller.
        SOURCE_ROOT="$(mktemp -d "${RUNNER_TEMP%/}/manjaro-iso-action-sources.XXXXXX")"
        PKGBUILDS_DIR="${SOURCE_ROOT}/PKGBUILDs"
        PACMAN_MIRRORS_DIR="${SOURCE_ROOT}/pacman-mirrors"

        {
          echo "MANJARO_ISO_ACTION_PKGBUILDS_DIR=${PKGBUILDS_DIR}"
          echo "MANJARO_ISO_ACTION_PACMAN_MIRRORS_DIR=${PACMAN_MIRRORS_DIR}"
        } >> "${GITHUB_ENV}"

        checkout_source() {
          local source_name="$1"
          local repository_url="$2"
          local branch_name="$3"
          local requested_commit="$4"
          local destination="$5"
          local resolved_commit

          if [[ -z "${branch_name}" ]] || ! git check-ref-format --branch "${branch_name}" >/dev/null; then
            echo "::error title=Invalid branch::A valid branch name is required for ${source_name}." >&2
            return 1
          fi

          # A full SHA must be supplied for pinning. The commit must be part
          # of the selected branch's history; otherwise fail instead of
          # silently checking out an unrelated source revision.
          if [[ -n "${requested_commit}" ]]; then
            if [[ ! "${requested_commit}" =~ ^([[:xdigit:]]{40}|[[:xdigit:]]{64})$ ]]; then
              echo "::error title=Invalid commit SHA::${source_name} commit must be a full 40-character or 64-character hexadecimal SHA." >&2
              return 1
            fi

            echo "## Cloning ${source_name} branch ${branch_name} for commit verification"
            git clone \
              --depth 1 \
              --single-branch \
              --branch "${branch_name}" \
              "${repository_url}" \
              "${destination}"

            # The pinned commit is often the branch tip, in which case no
            # further fetch is needed. For an older commit, fetch branch
            # history only on this explicit pinning path.
            if ! git -C "${destination}" cat-file -e "${requested_commit}^{commit}" 2>/dev/null; then
              git -C "${destination}" fetch --no-tags --unshallow origin "${branch_name}"
            fi

            if ! git -C "${destination}" cat-file -e "${requested_commit}^{commit}" 2>/dev/null; then
              echo "::error title=Commit not found::${requested_commit} is not available in the history of ${source_name} branch ${branch_name}." >&2
              return 1
            fi

            if ! git -C "${destination}" merge-base --is-ancestor \
              "${requested_commit}" "refs/remotes/origin/${branch_name}"; then
              echo "::error title=Commit is not on selected branch::${requested_commit} is not an ancestor of ${source_name} branch ${branch_name}." >&2
              return 1
            fi

            git -C "${destination}" checkout --detach "${requested_commit}"
          else
            # Default behaviour: shallow-check out the latest commit on the
            # selected branch. This is not a provenance/signature check.
            echo "## Cloning latest ${source_name} commit from branch ${branch_name}"
            git clone \
              --depth 1 \
              --single-branch \
              --branch "${branch_name}" \
              "${repository_url}" \
              "${destination}"
          fi

          resolved_commit="$(git -C "${destination}" rev-parse --verify 'HEAD^{commit}')"

          if [[ -n "${requested_commit}" && "${resolved_commit,,}" != "${requested_commit,,}" ]]; then
            echo "::error title=Commit verification failed::Requested ${requested_commit}, but checked out ${resolved_commit}." >&2
            return 1
          fi

          echo "## ${source_name} resolved commit: ${resolved_commit}"
          echo "::notice title=${source_name} commit::${resolved_commit}"
        }

        checkout_source \
          "PKGBUILDs" \
          "https://code.manjaro.org/packages/PKGBUILDs.git" \
          "${PKGBUILDS_BRANCH}" \
          "${PKGBUILDS_COMMIT}" \
          "${PKGBUILDS_DIR}"

        checkout_source \
          "pacman-mirrors" \
          "https://code.manjaro.org/applications/pacman-mirrors.git" \
          "${PACMAN_MIRRORS_BRANCH}" \
          "${PACMAN_MIRRORS_COMMIT}" \
          "${PACMAN_MIRRORS_DIR}"

    - id: install-pacman
      shell: bash
      env:
        PACMAN_VERSION: 6.0.2
      run: |
        sudo wget "https://sources.archlinux.org/other/pacman/pacman-${PACMAN_VERSION}.tar.xz"
        sudo tar -xvf "pacman-${PACMAN_VERSION}.tar.xz"
        pushd "pacman-${PACMAN_VERSION}"
        ## sudo patch -p1 -i ../pacman-sync-first-option.patch
        sudo meson --prefix=/usr \
                    --buildtype=plain \
                    -Ddoc=disabled \
                    -Ddoxygen=enabled \
                    -Dscriptlet-shell=/usr/bin/bash \
                    -Dldconfig=/usr/bin/ldconfig \
                    build
        sudo meson compile -C build
        sudo meson install -C build
        popd
        sudo install -m644 "${MANJARO_ISO_ACTION_PKGBUILDS_DIR}/core/pacman/pacman.conf" /etc/pacman.conf
        sudo install -m644 "${MANJARO_ISO_ACTION_PKGBUILDS_DIR}/core/pacman/makepkg.conf" /etc/
        sudo mkdir -p /etc/pacman.d
        sudo touch /etc/pacman.d/mirrorlist

    - id: install-keyrings
      shell: bash
      run: |
        sudo install -dm755 /usr/share/pacman/keyrings/

        sudo install -m0644 "${MANJARO_ISO_ACTION_PKGBUILDS_DIR}/core/manjaro-keyring/manjaro.gpg" /usr/share/pacman/keyrings/
        sudo install -m0644 "${MANJARO_ISO_ACTION_PKGBUILDS_DIR}/core/manjaro-keyring/manjaro-revoked" /usr/share/pacman/keyrings/
        sudo install -m0644 "${MANJARO_ISO_ACTION_PKGBUILDS_DIR}/core/manjaro-keyring/manjaro-trusted" /usr/share/pacman/keyrings/

        mkdir -p archlinux-keyring
        pushd archlinux-keyring
          wget https://archlinux.org/packages/core/any/archlinux-keyring/download -O /tmp/archlinux-keyring.tar.zst
          tar --use-compress-program=unzstd --strip-components=4 --wildcards -xvf /tmp/archlinux-keyring.tar.zst usr/share/pacman/keyrings/*
          sudo install -m0644 archlinux.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-trusted /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-revoked /usr/share/pacman/keyrings/
        popd

        sudo pacman-key --init
        sudo pacman-key --populate archlinux manjaro

        for gpg_key in ${{ inputs.additional-trusted-gpg }}; do
          sudo pacman-key --keyserver keys.openpgp.org --recv-key "$gpg_key"
          sudo pacman-key --lsign-key "$gpg_key"
        done

    - id: install-arch-install-scripts
      shell: bash
      env:
        VERSION: "27"
      run: |
        sudo wget "https://github.com/archlinux/arch-install-scripts/archive/refs/tags/v${VERSION}.tar.gz" -O arch-install-scripts.tar.gz
        sudo tar -xvf arch-install-scripts.tar.gz
        sudo make -C "arch-install-scripts-${VERSION}"
        sudo make -C "arch-install-scripts-${VERSION}" check
        sudo make -C "arch-install-scripts-${VERSION}" PREFIX=/usr install

        sudo install -m0644 "${MANJARO_ISO_ACTION_PACMAN_MIRRORS_DIR}/data/etc/pacman-mirrors.conf" /etc/pacman-mirrors.conf

    - id: install-calamares-tools
      shell: bash
      run: |
        sudo git clone --depth 1 https://code.manjaro.org/applications/calamares-tools.git

        cd calamares-tools
        sudo install -d /usr/share/calamares/
        sudo cp -rv schemas/ /usr/share/calamares/

    - id: install-mkinitcpio
      shell: bash
      env:
        VERSION: "32"
      run: |
        sudo wget "https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v${VERSION}/mkinitcpio-v${VERSION}.tar.gz"
        sudo tar -xf "mkinitcpio-v${VERSION}.tar.gz"
        sudo make -C "mkinitcpio-v${VERSION}" install
        sudo sed -i -e 's|File|Path|' /usr/share/libalpm/hooks/*hook

    - id: install-manjaro-tools
      shell: bash
      env:
        CUSTOM_REPO: ${{ inputs.custom-repo }}
      run: |
        sudo git clone --depth 1 https://code.manjaro.org/tools/manjaro-tools.git
        cd manjaro-tools
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_base
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_yaml
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_iso
        if [ ! -z "${CUSTOM_REPO}" ]; then
          echo "## adding repo [${CUSTOM_REPO}]"
          sudo sed -i -e "s/\[core\]/\[${CUSTOM_REPO}\]\nSigLevel = PackageRequired\nInclude = \/etc\/pacman\.d\/mirrorlist\n\n\[core\]/" /usr/share/manjaro-tools/pacman-multilib.conf
        fi

    - id: checkout-iso-profiles
      shell: bash
      env:
        REPO: ${{ inputs.iso-profiles-repo }}
        BRANCH: ${{ inputs.iso-profiles-branch }}
      run: |
        if [[ -n "${BRANCH}" ]]; then
          sudo git clone --depth 1 --branch "${BRANCH}" "${REPO}" iso-profiles
        else
          sudo git clone --depth 1 "${REPO}" iso-profiles
        fi

    - id: cleanup_space_workaround
      shell: bash
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - id: image-build
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        BRANCH: ${{ inputs.branch }}
        SCOPE: ${{ inputs.scope }}
        VERSION: ${{ inputs.version }}
        KERNEL: ${{ inputs.kernel }}
        CODE_NAME: ${{ inputs.code-name }}
        OFFICE: ${{ inputs.office-chooser }}
        BUILD_MIRROR: ${{ inputs.build-mirror }}
      run: |
        echo "## building iso"
        [ "$SCOPE" == "minimal" ] && unset SCOPE && unset OFFICE
        [ "$OFFICE" == "false" ] && unset OFFICE

        # This file comes from the selected PKGBUILDs checkout. When a commit
        # SHA is pinned, the checkout step verifies and selects that revision.
        source "${MANJARO_ISO_ACTION_PKGBUILDS_DIR}/core/manjaro-release/lsb-release"

        sudo sed -i -e "s|dist_name=\$(get_distname)|dist_name=${DISTRIB_ID%Linux}|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e 's|iso_name=$(get_osid)|iso_name=manjaro|g' /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|dist_release=\$(get_release)|dist_release=${VERSION:-$DISTRIB_RELEASE}|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|dist_codename=\$(get_codename)|dist_codename=\"${CODE_NAME:-$DISTRIB_CODENAME}\"|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|build_mirror='https://mirror.easyname.at/manjaro'|build_mirror=\'${BUILD_MIRROR}\'|g" /usr/lib/manjaro-tools/util.sh

        sudo buildiso ${SCOPE:+-f} -p "$EDITION" -b "$BRANCH" -k "$KERNEL" ${OFFICE:+-o}

        sudo rm -Rf /var/lib/manjaro-tools/buildiso/*

        OUTPUT_ISO_PATH=$(find /var/cache/manjaro-tools/iso -type f -name "*.iso" -exec stat -c '%Y %n' {} \; | sort -nr | awk 'NR==1 {print $2}')
        if [[ -z "$OUTPUT_ISO_PATH" || ! -f "$OUTPUT_ISO_PATH" ]]; then
          echo "::error title=ISO build failed::No ISO file was found in the build output directory."
          exit 1
        fi

        TARGET_ISO_PATH=$(basename "$OUTPUT_ISO_PATH")
        mv "$OUTPUT_ISO_PATH" "./$TARGET_ISO_PATH"
        echo "file-path=$TARGET_ISO_PATH" >> "$GITHUB_OUTPUT"

        FILE_PKG=$(find /var/cache/manjaro-tools/iso -type f -name "*-pkgs.txt" -exec stat -c '%Y %n' {} \; | sort -nr | awk 'NR==1 {print $2}')
        if [[ -n "$FILE_PKG" && -f "$FILE_PKG" ]]; then
          mv "$FILE_PKG" "./${TARGET_ISO_PATH}.pkgs"
        fi

    - id: hash
      shell: bash
      run: |
        echo "## calculating hashes"
        ISO_PATH="${{ steps.image-build.outputs.file-path }}"
        sha1sum "$ISO_PATH" > "${ISO_PATH}.sha1"
        sha256sum "$ISO_PATH" > "${ISO_PATH}.sha256"
        sha512sum "$ISO_PATH" > "${ISO_PATH}.sha512"

    - id: gpg_sign
      shell: bash
      run: |
        # if is not yet supported in composite https://github.com/actions/runner/blob/main/docs/adrs/0549-composite-run-steps.md#if-condition
        if [ -z "${{ inputs.gpg-secret-key-base64 }}" ]; then
          echo "## no gpg secret given"
          exit 0
        fi
        echo "## gpg signing"
        printf '%s' "${{ inputs.gpg-secret-key-base64 }}" | base64 --decode | gpg --batch --import &>/dev/null
        gpg --pinentry-mode loopback --passphrase "${{ inputs.gpg-passphrase }}" --batch --detach-sign "./${{ steps.image-build.outputs.file-path }}"

    - id: upload-prepare
      shell: bash -O extglob {0}
      run: |
        echo "## ssh setup"
        mkdir -p /home/runner/.ssh
        touch /home/runner/.ssh/github_actions
        chmod 600 /home/runner/.ssh/github_actions
        ssh-agent -a /tmp/ssh_agent.sock > /dev/null
        echo "upload-files=./${{ steps.image-build.outputs.file-path }}+(|.sha*|.pkgs|.sig|.torrent)" >> "$GITHUB_OUTPUT"
        mkdir -p "${{ inputs.edition }}/${{ inputs.version }}"

    - name: upload-sourceforge
      shell: bash -O extglob {0}
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      run: |
        if [ -z "${{ inputs.sf-project }}" ] || [ -z "${{ inputs.sf-user }}" ] || [ -z "${{ inputs.sf-key }}" ]; then
          echo "## not (all) credentials given for sourceforge upload"
          exit 0
        fi
        echo "## sourceforge upload"

        ssh-keyscan -t rsa frs.sourceforge.net >> /home/runner/.ssh/known_hosts
        echo "${{ inputs.sf-key }}" >> /home/runner/.ssh/github_actions
        ssh-add /home/runner/.ssh/github_actions

        rsync -vaP --stats -e ssh ${{ inputs.edition }} \
          "${{ inputs.sf-user }}@frs.sourceforge.net:/home/frs/project/${{ inputs.sf-project }}/"

        rsync -vaP --stats -e ssh ${{ steps.upload-prepare.outputs.upload-files }} \
          "${{ inputs.sf-user }}@frs.sourceforge.net:/home/frs/project/${{ inputs.sf-project }}/${{ inputs.edition }}/${{ inputs.version }}/"

    - id: upload-github-release
      shell: bash -O extglob {0}
      env:
        LIMIT_MB: '2000'
      run: |
        if [ -z "${{ inputs.release-tag }}" ]; then
          echo "## no release tag given"
          exit 0
        fi
        echo "## github upload"

        echo "${{ github.token }}" | gh auth login --with-token
        gh release create "${{ inputs.release-tag }}" --title "${{ inputs.release-tag }}" --repo "${{ github.repository }}" --notes "automated release" || echo "release already exists"

        GITHUB_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release-tag }}"

        if [[ -z "$(du --threshold="${LIMIT_MB}"M "${{ steps.image-build.outputs.file-path }}")" ]]; then
          gh release upload "${{ inputs.release-tag }}" --repo "${{ github.repository }}" --clobber \
            ${{ steps.upload-prepare.outputs.upload-files }}
        else
          zip -j -s "${LIMIT_MB}"m "${{ steps.image-build.outputs.file-path }}.zip" "${{ steps.image-build.outputs.file-path }}"

          gh release upload "${{ inputs.release-tag }}" --repo "${{ github.repository }}" --clobber \
            ./${{ steps.image-build.outputs.file-path }}+(.z*|.sha*|.pkgs|.sig|.torrent)
        fi

    - name: upload-cdn77-s3
      shell: bash -O extglob {0}
      run: |
        if [ -z "${{ inputs.s3-cfg }}" ]; then
          echo "## credentials for cdn77 S3 upload not provided. Skipping."
          exit 0
        fi

        echo "## create torrent"
        mktorrent -v -a udp://tracker.opentrackr.org:1337 -l 21 \
          -w "https://download.manjaro.org/${{ inputs.edition }}/${{ inputs.version }}/${{ steps.image-build.outputs.file-path }}" \
          -o "${{ steps.image-build.outputs.file-path }}.torrent" "${{ steps.image-build.outputs.file-path }}"

        echo "## cdn77 S3 upload"
        printf '%s\n' "${{ inputs.s3-cfg }}" > /home/runner/.s3cfg

        # Expand patterns while assigning the array. Keep each resolved path
        # quoted while moving it so spaces are not split and glob characters
        # are not re-expanded in a filename.
        shopt -s nullglob
        ISO_PATH="${{ steps.image-build.outputs.file-path }}"
        upload_files=( "$ISO_PATH" )

        if [[ ! -f "$ISO_PATH" ]]; then
          echo "::error title=Upload preparation failed::The generated ISO is missing: ${ISO_PATH}" >&2
          exit 1
        fi

        # Include optional sidecar files only when they actually exist.
        for file in "$ISO_PATH".sha* "$ISO_PATH".pkgs "$ISO_PATH".sig "$ISO_PATH".torrent; do
          if [[ -f "$file" ]]; then
            upload_files+=( "$file" )
          fi
        done

        for file in "${upload_files[@]}"; do
          mv -- "$file" "${{ inputs.edition }}/${{ inputs.version }}/"
        done

        s3cmd sync --progress --recursive -F "${{ inputs.edition }}" s3://s3downloadseu/
